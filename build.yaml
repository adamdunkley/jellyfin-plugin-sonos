version: "0.1.5.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Play Jellyfin music to Sonos S2 speakers"
description: >
  Discovers Sonos S2 players on the LAN and plays the Jellyfin music library
  using native Sonos queueing. Dual-builds for Jellyfin 10.11 (net9) and 12.x (net10).
category: "Music"
owner: "adamdunkley"
artifacts:
  - "Jellyfin.Plugin.Sonos.dll"
changelog: >
  Queue/Play verifies the speaker switched before setting pluginOwned; otherwise
  returns 502 TransportNotSwitched. QueueResponse adds transportMatched,
  speakerItemId/Uri, usesCloudQueue, and publishedBaseUrl. Clients must treat
  TransportNotSwitched as cast failure and should not trust queue metadata when
  transportMatched is false.
